[package]
name = "promptx"
version = "1.5.0"
description = "A lightweight AI prompt clipboard tool"
authors = ["PromptX Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
# 自动更新（更新包经 minisign 私钥签名，客户端用内置公钥校验）
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
thiserror = "1"
regex = "1"
enigo = "0.3"
tokio = { version = "1", features = ["time"] }
# 跨进程文件锁：Native Messaging host 与主进程串行化 data.json 读改写
fs4 = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
# API Key 安全存储：Windows 凭据管理器
keyring = "3"
# Native Messaging 主机注册表写入（HKCU）
winreg = "0.56"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

# 发布构建：体积与性能优化（Tauri 官方推荐配置）
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
