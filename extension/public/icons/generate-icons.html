<!DOCTYPE html>
<html>
<head>
  <title>PromptX Icon Generator</title>
  <style>
    body {
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .icon-grid {
      display: flex;
      gap: 20px;
      margin: 20px;
    }
    .icon-box {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #3B82F6, #60A5FA);
      border-radius: 20%;
      font-family: Arial, sans-serif;
      font-weight: bold;
      color: white;
    }
    .icon-16 { width: 16px; height: 16px; font-size: 10px; }
    .icon-32 { width: 32px; height: 32px; font-size: 16px; }
    .icon-48 { width: 48px; height: 48px; font-size: 24px; }
    .icon-128 { width: 128px; height: 128px; font-size: 48px; border-radius: 24px; }
    .instructions {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>PromptX Extension Icons</h1>

  <div class="icon-grid">
    <div class="icon-box icon-16">P</div>
    <div class="icon-box icon-32">P</div>
    <div class="icon-box icon-48">P</div>
    <div class="icon-box icon-128">PX</div>
  </div>

  <div class="instructions">
    <h3>How to create icons:</h3>
    <ol>
      <li>右键点击每个图标，选择"另存为图片"</li>
      <li>或者使用在线工具: <a href="https://favicon.io/emoji-favicons/" target="_blank">favicon.io</a></li>
      <li>将生成的 PNG 文件放入 <code>public/icons/</code> 目录</li>
      <li>命名为: icon16.png, icon32.png, icon48.png, icon128.png</li>
    </ol>
    <p><strong>推荐图标:</strong> 📋 (clipboard) 或 📝 (memo)</p>
  </div>
</body>
</html>
