name: Release

# 推送 v* 标签自动构建产物并发布 GitHub Release：
# Windows 安装包（NSIS/MSI，由 tauri build 产出）+ 浏览器扩展 zip
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # tauri build 会先执行 beforeBuildCommand（前端构建）再编译 Rust 并打包。
      # 签名密钥使 NSIS 产物附带 .sig 签名文件，供客户端 updater 校验
      - run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: 收集安装包
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/nsis/*.exe release/
          cp src-tauri/target/release/bundle/msi/*.msi release/ || true
          cp src-tauri/target/release/bundle/nsis/*.sig release/ || true
          ls -la release/
      # 自动更新清单：客户端 updater 从 latest.json 获取版本/签名/下载地址。
      # 用 node JSON.stringify 生成，签名文件内容无需担心换行/转义问题
      - name: 生成 updater 的 latest.json
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SETUP_EXE="PromptX_${VERSION}_x64-setup.exe"
          SIG_FILE="src-tauri/target/release/bundle/nsis/${SETUP_EXE}.sig"
          if [ -f "$SIG_FILE" ]; then
            SETUP_EXE="$SETUP_EXE" VERSION="$VERSION" TAG="$GITHUB_REF_NAME" SIG_FILE="$SIG_FILE" \
            node -e "
              const fs = require('fs');
              const manifest = {
                version: process.env.VERSION,
                pub_date: new Date().toISOString(),
                platforms: {
                  'windows-x86_64': {
                    signature: fs.readFileSync(process.env.SIG_FILE, 'utf8'),
                    url: 'https://github.com/kanosa0101/PromptX/releases/download/' + process.env.TAG + '/' + process.env.SETUP_EXE
                  }
                }
              };
              fs.writeFileSync('release/latest.json', JSON.stringify(manifest, null, 2));
              console.log('latest.json generated for v' + process.env.VERSION);
            "
          else
            echo "::warning::未找到签名文件，跳过 latest.json（自动更新将不可用）"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release/

  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      # shared/ 代码向上解析到根 node_modules（fuse.js/pinyin-pro 等在根声明）
      - run: npm ci
      - working-directory: extension
        run: npm ci
      - working-directory: extension
        run: npm run build
      - name: 打包扩展 zip（以标签命名）
        working-directory: extension
        run: |
          cd dist
          zip -r "../PromptX-extension-${GITHUB_REF_NAME}.zip" .
          cd ..
          ls -la *.zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-artifact
          path: extension/PromptX-extension-*.zip

  release:
    needs: [build-windows, build-extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist-windows
      - uses: actions/download-artifact@v4
        with:
          name: extension-artifact
          path: dist-extension
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-windows/*.exe
            dist-windows/*.msi
            dist-windows/*.sig
            dist-windows/latest.json
            dist-extension/*.zip
